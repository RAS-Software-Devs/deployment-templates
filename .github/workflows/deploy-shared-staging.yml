name: Deploy Shared Staging Infrastructure

on:
  pull_request:
    paths:
      - shared-staging-alb/**
      - .github/workflows/deploy-shared-staging.yml
  push:
    branches: [main]
    paths:
      - shared-staging-alb/**
      - .github/workflows/deploy-shared-staging.yml
  workflow_dispatch:

concurrency:
  group: shared-staging-infrastructure
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  STACK_NAME: ras-staging-shared-alb

jobs:
  validate:
    name: Validate shared staging stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate CloudFormation template
        uses: aws-cloudformation/cfn-lint-action@v2
        with:
          args: shared-staging-alb/template.yml

      - name: Validate staging parameters
        run: |
          jq -e '
            has("VpcId") and
            has("SubnetIds") and
            has("AlbSecurityGroupId") and
            has("EcsSecurityGroupId") and
            has("SsmHostSecurityGroupId") and
            (.SubnetIds | type == "array" and length >= 2)
          ' shared-staging-alb/parameters/staging.json >/dev/null

  deploy:
    name: Deploy shared staging stack
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy shared staging infrastructure
        run: |
          mapfile -t PARAMETERS < <(
            jq -r 'to_entries[] | "\(.key)=\(.value | if type == "array" then join(",") else . end)"' \
              shared-staging-alb/parameters/staging.json
          )

          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --template-file shared-staging-alb/template.yml \
            --no-fail-on-empty-changeset \
            --tags \
              Environment=staging \
              ManagedBy=CloudFormation \
              Repository=RAS-Software-Devs/deployment-templates \
            --parameter-overrides "${PARAMETERS[@]}"

      - name: Publish stack outputs
        run: |
          aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table | tee -a "$GITHUB_STEP_SUMMARY"