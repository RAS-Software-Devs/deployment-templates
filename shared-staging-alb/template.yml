AWSTemplateFormatVersion: '2010-09-09'
Description: Shared internal staging ALB for RAS ECS HTTP services

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  EcsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  SsmHostSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  SharedAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: ras-staging-shared-alb
      Scheme: internal
      Type: application
      SecurityGroups:
        - !Ref AlbSecurityGroupId
      Subnets: !Ref SubnetIds
      Tags:
        - Key: Name
          Value: ras-staging-shared-alb
        - Key: Environment
          Value: staging
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Repository
          Value: RAS-Software-Devs/deployment-templates

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref SharedAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: application/json
            MessageBody: '{"error":"route not found"}'

  AlbIngressFromSsmHost:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AlbSecurityGroupId
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref SsmHostSecurityGroupId
      Description: HTTP from the SSM test host over VPC peering

  AuthIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsSecurityGroupId
      IpProtocol: tcp
      FromPort: 8081
      ToPort: 8081
      SourceSecurityGroupId: !Ref AlbSecurityGroupId
      Description: Authorization traffic from shared ALB

Outputs:
  VpcId:
    Value: !Ref VpcId
    Export:
      Name: ras-staging-vpc-id
  SubnetIds:
    Value: !Join [',', !Ref SubnetIds]
    Export:
      Name: ras-staging-private-subnet-ids
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroupId
    Export:
      Name: ras-staging-shared-alb-security-group-id
  EcsSecurityGroupId:
    Value: !Ref EcsSecurityGroupId
    Export:
      Name: ras-staging-ecs-security-group-id
  AlbArn:
    Value: !Ref SharedAlb
    Export:
      Name: ras-staging-shared-alb-arn
  AlbDnsName:
    Value: !GetAtt SharedAlb.DNSName
    Export:
      Name: ras-staging-shared-alb-dns-name
  HttpListenerArn:
    Value: !Ref HttpListener
    Export:
      Name: ras-staging-shared-http-listener-arn
